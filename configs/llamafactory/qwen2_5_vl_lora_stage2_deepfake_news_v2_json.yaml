model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
adapter_name_or_path: artifacts/lora_runs/qwen2_5_vl_stage1_domain_boost_json
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

dataset: stage2_deepfake_news_v2_mixed_json
dataset_dir: configs/llamafactory
template: qwen2_vl
cutoff_len: 4096
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 1

